<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Awwwards Practice</title>
    <style>
      :root {
        --bg: #f4f2ee;
        --fg: #11161c;
        --muted: #6b7280;
        --rule: #ddd8cd;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #0f1216;
          --fg: #f1efe9;
          --muted: #8b94a1;
          --rule: #242a33;
        }
      }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      body {
        min-height: 100svh;
        display: grid;
        place-items: center;
        padding: 2rem;
        background: var(--bg);
        color: var(--fg);
        font-family: ui-sans-serif, system-ui, -apple-system, sans-serif;
      }
      main { width: 100%; max-width: 48rem; }
      h1 {
        font-size: clamp(2rem, 5vw, 3.25rem);
        font-weight: 700;
        letter-spacing: -0.03em;
        line-height: 1.05;
      }
      .sub { margin-top: 0.75rem; color: var(--muted); font-size: 1.0625rem; }
      ul { list-style: none; margin-top: 3rem; border-top: 1px solid var(--rule); }
      li { border-bottom: 1px solid var(--rule); }
      a {
        display: flex;
        align-items: baseline;
        gap: 1.25rem;
        padding: 1.5rem 0.25rem;
        color: inherit;
        text-decoration: none;
        transition: padding-left 220ms cubic-bezier(0.2, 0, 0.1, 1);
      }
      a:hover, a:focus-visible { padding-left: 1rem; }
      .idx {
        font-variant-numeric: tabular-nums;
        font-size: 0.8125rem;
        color: var(--muted);
      }
      .name { font-size: clamp(1.25rem, 2.5vw, 1.75rem); font-weight: 600; letter-spacing: -0.02em; }
      .desc { margin-top: 0.3rem; color: var(--muted); font-size: 0.9375rem; }
      .arrow { margin-left: auto; color: var(--muted); }
    </style>
  </head>
  <body>
    <main>
      <h1>Awwwards Practice</h1>
      <p class="sub">Scroll and motion studies, one route each.</p>

      <ul>
        <li>
          <a href="/realevate/">
            <span class="idx">01</span>
            <span>
              <span class="name">Realevate</span>
              <span class="desc">Landing page — marquee, split-text reveals, image counter.</span>
            </span>
            <span class="arrow">&rarr;</span>
          </a>
        </li>
        <li>
          <a href="/sticky-cards/">
            <span class="idx">02</span>
            <span>
              <span class="name">Sticky Cards</span>
              <span class="desc">Scroll-pinned card deck that deals each card to the back.</span>
            </span>
            <span class="arrow">&rarr;</span>
          </a>
        </li>
      </ul>
    </main>
  </body>
</html>
